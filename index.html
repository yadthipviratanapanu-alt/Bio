<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading...</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:#050505;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%, rgba(88,101,242,.18), transparent 25%),
        radial-gradient(circle at 80% 80%, rgba(88,101,242,.18), transparent 25%);
    animation:bgMove 12s infinite alternate ease-in-out;
}

@keyframes bgMove{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.15);
    }
}

.card{
    position:relative;
    z-index:10;

    width:400px;
    max-width:90%;

    padding:40px;

    text-align:center;

    background:rgba(255,255,255,.05);
    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.08);

    border-radius:30px;

    box-shadow:
        0 0 30px rgba(0,0,0,.5);
}

.avatar{
    width:120px;
    height:120px;

    object-fit:cover;
    border-radius:50%;

    border:4px solid #5865F2;

    box-shadow:
        0 0 20px rgba(88,101,242,.6);
}

.name{
    margin-top:20px;
    font-size:30px;
    font-weight:700;
}

.bio{
    margin-top:8px;
    color:#bdbdbd;
    font-size:14px;
}

.discord-btn{
    margin-top:25px;

    display:inline-flex;
    align-items:center;
    gap:10px;

    padding:14px 28px;

    border-radius:15px;

    text-decoration:none;
    color:white;

    background:#5865F2;

    transition:.3s;
}

.discord-btn:hover{
    transform:translateY(-4px);

    box-shadow:
        0 0 25px rgba(88,101,242,.7);
}

.discord-btn i{
    font-size:22px;
}

.footer{
    margin-top:20px;
    color:#777;
    font-size:12px;
}

/* Snow */

#snow{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:999;
}

.snowflake{
    position:absolute;
    top:-10px;

    background:white;

    border-radius:50%;
    opacity:.8;

    animation:snowFall linear forwards;
}

@keyframes snowFall{

    from{
        transform:translateY(-10px);
    }

    to{
        transform:translateY(110vh);
    }

}

/* Click Snow */

.click-snow{
    position:fixed;

    width:8px;
    height:8px;

    background:white;

    border-radius:50%;

    pointer-events:none;

    z-index:1000;

    animation:explodeSnow 1s forwards;
}

@keyframes explodeSnow{

    from{
        transform:translate(0,0) scale(1);
        opacity:1;
    }

    to{
        transform:
            translate(var(--x), var(--y))
            scale(0);

        opacity:0;
    }

}

</style>
</head>
<body>

<div class="card">

    <img
        id="avatar"
        class="avatar"
        src=""
        alt="avatar">

    <div
        id="name"
        class="name">
        Loading...
    </div>

    <div
        id="bio"
        class="bio">
    </div>

    <a
        id="discordBtn"
        class="discord-btn"
        target="_blank">

        <i class="fab fa-discord"></i>
        Join Discord

    </a>

    <div class="footer">
        Unwelcome to my community
    </div>

</div>

<div id="snow"></div>

<script>

/* Load JSON */

fetch("./data.json")
.then(res => res.json())
.then(data => {

    document.title = data.name;

    document.getElementById("name").textContent =
        data.name;

    document.getElementById("bio").textContent =
        data.bio;

    document.getElementById("avatar").src =
        data.avatar;

    document.getElementById("discordBtn").href =
        data.discord;

})
.catch(() => {

    document.getElementById("name").textContent =
        "Failed To Load";

});

/* Falling Snow */

const snowContainer =
document.getElementById("snow");

function createSnowflake(){

    const snow =
    document.createElement("div");

    snow.classList.add("snowflake");

    const size =
    Math.random()*6+2;

    snow.style.width =
    size + "px";

    snow.style.height =
    size + "px";

    snow.style.left =
    Math.random()*window.innerWidth + "px";

    const duration =
    Math.random()*5+5;

    snow.style.animationDuration =
    duration + "s";

    snowContainer.appendChild(snow);

    setTimeout(() => {
        snow.remove();
    }, duration*1000);
}

setInterval(createSnowflake,120);

/* Click Snow Burst */

document.addEventListener("click",(e)=>{

    for(let i=0;i<15;i++){

        const snow =
        document.createElement("div");

        snow.classList.add("click-snow");

        snow.style.left =
        e.clientX + "px";

        snow.style.top =
        e.clientY + "px";

        const angle =
        Math.random()*Math.PI*2;

        const distance =
        50 + Math.random()*80;

        snow.style.setProperty(
            "--x",
            Math.cos(angle)*distance+"px"
        );

        snow.style.setProperty(
            "--y",
            Math.sin(angle)*distance+"px"
        );

        document.body.appendChild(snow);

        setTimeout(()=>{
            snow.remove();
        },1000);
    }

});

</script>

</body>
</html>
