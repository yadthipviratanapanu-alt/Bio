<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>สุขสันต์วันครบรอบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@300;400;500&display=swap" rel="stylesheet">
<style>

  /* ====== EDIT YOUR MESSAGE HERE (also see the JS "config" block near the bottom) ====== */

  :root{
    --plum-deep:   #170a10;
    --plum-mid:    #33101f;
    --rose:        #ff8aa1;
    --heart-red:   #ff4463;
    --cream:       #fff8f3;
    --ink:         #3a1220;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    background:var(--plum-deep);
    font-family:'Sarabun',sans-serif;
  }

  #stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 50% 30%, var(--plum-mid) 0%, var(--plum-deep) 68%);
    overflow:hidden;
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* animated heart-particle canvas background */
  #pinkboard{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    z-index:1;
    pointer-events:none;
  }

  #clickText{
    appearance:none; border:none; background:none; cursor:pointer;
    font-family:'Mitr',sans-serif;
    font-weight:600;
    font-size:clamp(2.4rem, 11vw, 4.2rem);
    letter-spacing:0.02em;
    color:var(--rose);
    text-shadow:0 0 22px rgba(255,138,161,0.55), 0 0 60px rgba(255,68,99,0.25);
    touch-action:manipulation;
    animation:pulse 1.7s ease-in-out infinite;
    padding:1.2rem 2rem;
    position:relative;
    z-index:2;
  }
  #clickText:active{ animation-play-state:paused; }
  @keyframes pulse{
    0%,100% { transform:scale(1);    text-shadow:0 0 22px rgba(255,138,161,0.55), 0 0 60px rgba(255,68,99,0.25); }
    50%     { transform:scale(1.16); text-shadow:0 0 34px rgba(255,138,161,0.85), 0 0 90px rgba(255,68,99,0.4); }
  }

  .hint{
    position:absolute;
    bottom:calc(9vh + env(safe-area-inset-bottom));
    left:50%; transform:translateX(-50%);
    color:var(--rose);
    opacity:0.5;
    font-size:0.85rem;
    letter-spacing:0.04em;
    z-index:2;
  }

  /* -- burst hearts -- */
  #particleLayer{
    position:fixed; inset:0;
    pointer-events:none;
    z-index:6;
  }
  .burst-heart{
    position:absolute;
    left:0; top:0;
    color:var(--heart-red);
    font-size:var(--fs, 16px);
    transform:translate(-50%,-50%);
    animation:burst 900ms cubic-bezier(.2,.7,.4,1) forwards;
  }
  @keyframes burst{
    0%   { transform:translate(-50%,-50%) translate(0,0) scale(0.4) rotate(0deg); opacity:1; }
    100% { transform:translate(-50%,-50%) translate(var(--tx), var(--ty)) scale(1) rotate(var(--rot)); opacity:0; }
  }

  /* -- white reveal circle -- */
  .reveal-circle{
    position:fixed;
    background:var(--cream);
    border-radius:50%;
    transform:translate(-50%,-50%) scale(0);
    transition:transform 1.15s cubic-bezier(.16,1,.3,1);
    z-index:5;
    pointer-events:none;
  }
  .reveal-circle.expand{ transform:translate(-50%,-50%) scale(1); }

  /* -- message -- */
  #message{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    padding:0 8vw;
    z-index:7;
    opacity:0;
    pointer-events:none;
  }
  #message.show{ opacity:1; }

  #titleLine, #subLine{
    margin:0;
    color:var(--ink);
  }
  #titleLine{
    font-family:'Mitr',sans-serif;
    font-weight:600;
    font-size:clamp(1.9rem, 8vw, 3.4rem);
    line-height:1.25;
  }
  #subLine{
    margin-top:0.9rem;
    font-family:'Sarabun',sans-serif;
    font-weight:400;
    font-size:clamp(1rem, 4vw, 1.35rem);
    color:#8a4152;
    line-height:1.6;
  }

  .bounce-letter{
    display:inline-block;
    opacity:0;
    transform:translateY(70px);
    animation:letterIn 700ms cubic-bezier(.32,1.65,.5,1) forwards;
    animation-delay:var(--d, 0ms);
  }
  .bounce-letter.space{ width:0.32em; }
  @keyframes letterIn{
    to{ opacity:1; transform:translateY(0); }
  }

  .final-heart{
    margin-top:1.6rem;
    font-size:clamp(1.6rem, 6vw, 2.2rem);
    color:var(--heart-red);
    opacity:0;
    animation:letterIn 700ms cubic-bezier(.32,1.65,.5,1) forwards;
    animation-delay:var(--heart-delay, 0ms);
  }

  @media (prefers-reduced-motion: reduce){
    #clickText{ animation:none; }
    .bounce-letter, .final-heart{ animation-duration:1ms !important; animation-delay:0ms !important; }
  }
</style>
</head>
<body>

  <div id="stage">
    <canvas id="pinkboard"></canvas>
    <button id="clickText" aria-label="คลิกเพื่อเปิดข้อความ">คลิก</button>
    <div class="hint">แตะที่คำว่า “คลิก”</div>
  </div>

  <div id="particleLayer"></div>

  <div id="message" aria-hidden="true">
    <h1 id="titleLine"></h1>
    <p id="subLine"></p>
    <div id="finalHeart" class="final-heart">♥</div>
  </div>

<script>
(function(){

  /* ================= EDIT YOUR MESSAGE HERE ================= */
  var config = {
    title: "สุขสันต์วันครบรอบนะค้าบที่รัก",
    subtitle: "ขอบคุณที่อยู่คอยอยู่กันมาตลอดนะ รักเธอมากขึ้นทุกวันเลยงับ 🤍"
  };
  /* ============================================================ */

  var stage = document.getElementById('stage');
  var clickText = document.getElementById('clickText');
  var particleLayer = document.getElementById('particleLayer');
  var message = document.getElementById('message');
  var titleLine = document.getElementById('titleLine');
  var subLine = document.getElementById('subLine');
  var finalHeart = document.getElementById('finalHeart');

  // ---- animated heart-particle canvas background ----
  var stopBackgroundHearts = initHeartCanvas(document.getElementById('pinkboard'));

  function initHeartCanvas(canvas){
    // tuned lighter than the original demo so it stays smooth on phones
    var settings = {
      particles: { length: 1600, duration: 4, velocity: 55, effect: -1.3, size: 7 }
    };

    function Point(x, y){
      this.x = typeof x !== 'undefined' ? x : 0;
      this.y = typeof y !== 'undefined' ? y : 0;
    }
    Point.prototype.clone = function(){ return new Point(this.x, this.y); };
    Point.prototype.length = function(length){
      if (typeof length === 'undefined') return Math.sqrt(this.x * this.x + this.y * this.y);
      this.normalize();
      this.x *= length; this.y *= length;
      return this;
    };
    Point.prototype.normalize = function(){
      var length = this.length();
      this.x /= length; this.y /= length;
      return this;
    };

    function Particle(){
      this.position = new Point();
      this.velocity = new Point();
      this.acceleration = new Point();
      this.age = 0;
    }
    Particle.prototype.initialize = function(x, y, dx, dy){
      this.position.x = x; this.position.y = y;
      this.velocity.x = dx; this.velocity.y = dy;
      this.acceleration.x = dx * settings.particles.effect;
      this.acceleration.y = dy * settings.particles.effect;
      this.age = 0;
    };
    Particle.prototype.update = function(deltaTime){
      this.position.x += this.velocity.x * deltaTime;
      this.position.y += this.velocity.y * deltaTime;
      this.velocity.x += this.acceleration.x * deltaTime;
      this.velocity.y += this.acceleration.y * deltaTime;
      this.age += deltaTime;
    };
    Particle.prototype.draw = function(context, image){
      function ease(t){ return --t * t * t + 1; }
      var size = image.width * ease(this.age / settings.particles.duration);
      context.globalAlpha = 1 - this.age / settings.particles.duration;
      context.drawImage(image, this.position.x - size / 2, this.position.y - size / 2, size, size);
    };

    function ParticlePool(length){
      var particles = new Array(length), firstActive = 0, firstFree = 0, duration = settings.particles.duration;
      for (var i = 0; i < particles.length; i++) particles[i] = new Particle();

      this.add = function(x, y, dx, dy){
        particles[firstFree].initialize(x, y, dx, dy);
        firstFree++;
        if (firstFree === particles.length) firstFree = 0;
        if (firstActive === firstFree) firstActive++;
        if (firstActive === particles.length) firstActive = 0;
      };
      this.update = function(deltaTime){
        var i;
        if (firstActive < firstFree){
          for (i = firstActive; i < firstFree; i++) particles[i].update(deltaTime);
        }
        if (firstFree < firstActive){
          for (i = firstActive; i < particles.length; i++) particles[i].update(deltaTime);
          for (i = 0; i < firstFree; i++) particles[i].update(deltaTime);
        }
        while (particles[firstActive].age >= duration && firstActive !== firstFree){
          firstActive++;
          if (firstActive === particles.length) firstActive = 0;
        }
      };
      this.draw = function(context, image){
        var i;
        if (firstActive < firstFree){
          for (i = firstActive; i < firstFree; i++) particles[i].draw(context, image);
        }
        if (firstFree < firstActive){
          for (i = firstActive; i < particles.length; i++) particles[i].draw(context, image);
          for (i = 0; i < firstFree; i++) particles[i].draw(context, image);
        }
      };
    }

    var context = canvas.getContext('2d'),
        particles = new ParticlePool(settings.particles.length),
        particleRate = settings.particles.length / settings.particles.duration,
        time, running = true, rafId;

    function pointOnHeart(t){
      return new Point(
        160 * Math.pow(Math.sin(t), 3),
        130 * Math.cos(t) - 50 * Math.cos(2 * t) - 20 * Math.cos(3 * t) - 10 * Math.cos(4 * t) + 25
      );
    }

    var heartImage = (function(){
      var c = document.createElement('canvas'), ctx = c.getContext('2d');
      c.width = settings.particles.size; c.height = settings.particles.size;
      function to(t){
        var p = pointOnHeart(t);
        p.x = settings.particles.size / 2 + (p.x * settings.particles.size) / 350;
        p.y = settings.particles.size / 2 - (p.y * settings.particles.size) / 350;
        return p;
      }
      ctx.beginPath();
      var t = -Math.PI, p = to(t);
      ctx.moveTo(p.x, p.y);
      while (t < Math.PI){ t += 0.02; p = to(t); ctx.lineTo(p.x, p.y); }
      ctx.closePath();
      ctx.fillStyle = '#ff4463';
      ctx.fill();
      var img = new Image();
      img.src = c.toDataURL();
      return img;
    })();

    function render(){
      if (!running) return;
      rafId = requestAnimationFrame(render);
      var newTime = Date.now() / 1000, deltaTime = newTime - (time || newTime);
      time = newTime;
      context.clearRect(0, 0, canvas.width, canvas.height);
      var amount = particleRate * deltaTime;
      for (var i = 0; i < amount; i++){
        var pos = pointOnHeart(Math.PI - 2 * Math.PI * Math.random());
        var dir = pos.clone().length(settings.particles.velocity);
        particles.add(canvas.width / 2 + pos.x, canvas.height / 2 - pos.y, dir.x, -dir.y);
      }
      particles.update(deltaTime);
      particles.draw(context, heartImage);
    }

    function onResize(){
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
    }
    window.addEventListener('resize', onResize);

    setTimeout(function(){ onResize(); render(); }, 10);

    return function stop(){
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      window.removeEventListener('resize', onResize);
    };
  }

  // ---- build the bounce-in letters ----
  function buildLine(container, text, startIndex, stepMs){
    var idx = startIndex;
    text.split('').forEach(function(ch){
      var span = document.createElement('span');
      span.className = 'bounce-letter' + (ch === ' ' ? ' space' : '');
      span.textContent = ch === ' ' ? '\u00A0' : ch;
      span.style.setProperty('--d', (idx * stepMs) + 'ms');
      container.appendChild(span);
      idx++;
    });
    return idx;
  }

  var STEP = 45;
  var nextIndex = buildLine(titleLine, config.title, 0, STEP);
  nextIndex = buildLine(subLine, config.subtitle, nextIndex, STEP);
  finalHeart.style.setProperty('--heart-delay', (nextIndex * STEP + 150) + 'ms');

  // ---- heart burst effect ----
  function spawnHeartBurst(x, y){
    var count = 16;
    for (var i = 0; i < count; i++){
      var el = document.createElement('div');
      el.className = 'burst-heart';
      el.textContent = Math.random() < 0.8 ? '♥' : '♡';
      var angle = (Math.PI * 2 * i / count) + (Math.random() * 0.5 - 0.25);
      var dist = 60 + Math.random() * 90;
      var tx = Math.cos(angle) * dist;
      var ty = Math.sin(angle) * dist - 20;
      el.style.setProperty('--tx', tx + 'px');
      el.style.setProperty('--ty', ty + 'px');
      el.style.setProperty('--rot', (Math.random() * 140 - 70) + 'deg');
      el.style.setProperty('--fs', (12 + Math.random() * 14) + 'px');
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      particleLayer.appendChild(el);
      (function(node){
        setTimeout(function(){ node.remove(); }, 950);
      })(el);
    }
  }

  // ---- white circle reveal ----
  function revealFrom(x, y){
    var vw = window.innerWidth, vh = window.innerHeight;
    var diameter = Math.hypot(Math.max(x, vw - x), Math.max(y, vh - y)) * 2.3;
    var circle = document.createElement('div');
    circle.className = 'reveal-circle';
    circle.style.width = diameter + 'px';
    circle.style.height = diameter + 'px';
    circle.style.left = x + 'px';
    circle.style.top = y + 'px';
    document.body.appendChild(circle);

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        circle.classList.add('expand');
      });
    });

    circle.addEventListener('transitionend', function(){
      message.classList.add('show');
      message.removeAttribute('aria-hidden');
    }, { once:true });
  }

  var triggered = false;
  function handleActivate(e){
    if (triggered) return;
    triggered = true;

    var rect = clickText.getBoundingClientRect();
    var x = rect.left + rect.width / 2;
    var y = rect.top + rect.height / 2;

    clickText.style.pointerEvents = 'none';
    clickText.style.transition = 'opacity 250ms ease';
    clickText.style.opacity = '0';
    var hintEl = document.querySelector('.hint');
    if (hintEl) hintEl.style.opacity = '0';

    spawnHeartBurst(x, y);
    revealFrom(x, y);
    setTimeout(function(){ stopBackgroundHearts(); }, 1200);
  }

  clickText.addEventListener('click', handleActivate);

})();
</script>
</body>
</html>
